services:
  frontend:
    image: nimbus/frontend:latest
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    restart: unless-stopped

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nimbus}
      POSTGRES_USER: ${POSTGRES_USER:-nimbus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nimbus_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres-data:
